# Build or converge one environment:
#   ansible-playbook -i ansible/inventories/<env>/hosts.yml ansible/site.yml
- name: Pre-flight environment guard
  hosts: k8s_cluster
  gather_facts: false
  any_errors_fatal: true
  roles:
    - preflight

- name: Prepare every node
  hosts: k8s_cluster
  environment: "{{ proxy_env }}"
  roles:
    - common

- name: Build the control plane
  hosts: control_plane
  environment: "{{ proxy_env }}"
  roles:
    - control_plane

- name: Join the workers
  hosts: workers
  environment: "{{ proxy_env }}"
  roles:
    - worker

- name: Hand the cluster over to Argo CD
  hosts: control_plane[0]
  environment: "{{ proxy_env }}"
  roles:
    - argocd_bootstrap
