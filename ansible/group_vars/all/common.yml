# Settings shared by every environment.
ansible_user: haison
ansible_become: true

kube_apiserver_port: 6443
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12

# Written on first run; later runs refuse to touch a host whose marker names another environment.
env_marker_path: /etc/k8s-demo/env

# Where scripts/get-kubeconfig.sh stores per-environment kubeconfig files.
local_kubeconfig_dir: ~/.kube

# Proxy environment for every task that reaches the Internet (apt, get_url, kubectl apply -f https://...).
proxy_env:
  http_proxy: "{{ proxy_http }}"
  https_proxy: "{{ proxy_https }}"
  no_proxy: "{{ proxy_no_proxy }}"
  HTTP_PROXY: "{{ proxy_http }}"
  HTTPS_PROXY: "{{ proxy_https }}"
  NO_PROXY: "{{ proxy_no_proxy }}"

# Addresses that must be free before a new cluster is built: the API VIP and the whole MetalLB pool.
reserved_ips: >-
  {%- set first = metallb_range_start | ansible.utils.ipaddr('int') | int -%}
  {%- set last = metallb_range_end | ansible.utils.ipaddr('int') | int -%}
  {%- set ips = [kube_vip_address] -%}
  {%- for i in range(0, last - first + 1) -%}
  {%- set _ = ips.append(metallb_range_start | ansible.utils.ipmath(i)) -%}
  {%- endfor -%}
  {{ ips }}
