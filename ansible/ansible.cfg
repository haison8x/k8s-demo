# No default inventory on purpose: every run must name its environment with
# `-i ansible/inventories/<env>/hosts.yml`.
[defaults]
roles_path = roles
forks = 10
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
