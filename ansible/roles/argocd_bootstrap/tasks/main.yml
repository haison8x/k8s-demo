# One-time hand-off from Ansible to Argo CD. Safe to re-run: Argo CD is only
# installed when missing; afterwards it manages itself from Git.
- name: Record the cluster identity used by the environment policy
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create configmap cluster-identity -n kube-system \
      --from-literal=env={{ env }} --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_bootstrap_identity
  changed_when: "'unchanged' not in argocd_bootstrap_identity.stdout"

- name: Check whether Argo CD is installed
  ansible.builtin.command: kubectl -n argocd get deployment argocd-server
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_bootstrap_existing
  changed_when: false
  failed_when: false

- name: Install Argo CD
  when: argocd_bootstrap_existing.rc != 0
  block:
    - name: Render the Argo CD overlay from this repository
      ansible.builtin.command: "kubectl kustomize {{ playbook_dir }}/../gitops/platform/argocd/overlays/{{ env }}"
      delegate_to: localhost
      become: false
      register: argocd_bootstrap_manifest
      changed_when: false

    - name: Copy the rendered Argo CD manifest
      ansible.builtin.copy:
        content: "{{ argocd_bootstrap_manifest.stdout }}"
        dest: /etc/kubernetes/argocd-install.yaml
        mode: "0600"

    - name: Apply the Argo CD manifest
      ansible.builtin.command: kubectl apply --server-side --force-conflicts -f /etc/kubernetes/argocd-install.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Wait for the Argo CD server
      ansible.builtin.command: kubectl -n argocd rollout status deployment/argocd-server --timeout=600s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Set the Argo CD admin password
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - argocd
          - patch
          - secret
          - argocd-secret
          - --type
          - merge
          - -p
          - >-
            {{ {'stringData': {'admin.password': argocd_admin_password | password_hash('bcrypt'),
                               'admin.passwordMtime': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')}} | to_json }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: argocd_admin_password is defined and argocd_admin_password | length > 0
      changed_when: true
      no_log: true

    - name: Remove the generated initial admin secret
      ansible.builtin.command: kubectl -n argocd delete secret argocd-initial-admin-secret --ignore-not-found
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: argocd_admin_password is defined and argocd_admin_password | length > 0
      changed_when: true

- name: Write the root Application
  ansible.builtin.template:
    src: root-app.yaml.j2
    dest: /etc/kubernetes/argocd-root-app.yaml
    mode: "0644"

- name: Apply the root Application
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/argocd-root-app.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_bootstrap_root
  changed_when: "'unchanged' not in argocd_bootstrap_root.stdout"
