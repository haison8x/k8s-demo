- name: Join this node as a control plane
  ansible.builtin.shell: >-
    {{ hostvars[groups['control_plane'][0]].control_plane_join_command }}
    --control-plane
    --certificate-key {{ hostvars[groups['control_plane'][0]].control_plane_certificate_key }}
    --apiserver-advertise-address {{ ansible_host }}
    && touch /etc/kubernetes/.k8s-demo-join-done
  args:
    creates: /etc/kubernetes/.k8s-demo-join-done
  throttle: 1
  no_log: true
