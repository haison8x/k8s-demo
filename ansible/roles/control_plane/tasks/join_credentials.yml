# Fresh, short-lived join credentials on every run; never logged.
- name: Create a node join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: control_plane_join
  changed_when: false
  no_log: true

- name: Upload control-plane certificates for joining control planes
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: control_plane_certs
  changed_when: false
  no_log: true

- name: Remember the join credentials
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ control_plane_join.stdout | trim }}"
    control_plane_certificate_key: "{{ control_plane_certs.stdout_lines | last }}"
  no_log: true
