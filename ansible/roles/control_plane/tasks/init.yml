- name: Write the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    mode: "0600"

- name: Run kubeadm init
  ansible.builtin.command: >-
    kubeadm init --config /etc/kubernetes/kubeadm-init.yaml --upload-certs
    --ignore-preflight-errors=DirAvailable--etc-kubernetes-manifests
  args:
    creates: /etc/kubernetes/admin.conf

- name: Point kube-vip back to admin.conf
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-vip.yaml
    regexp: /etc/kubernetes/super-admin.conf
    replace: /etc/kubernetes/admin.conf

- name: Install the Calico operator
  ansible.builtin.command: >-
    kubectl apply --server-side
    -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Wait for the Calico operator CRDs
  ansible.builtin.command: >-
    kubectl wait --for condition=established --timeout=180s
    crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Write the Calico installation
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: /etc/kubernetes/calico-installation.yaml
    mode: "0644"

- name: Install Calico
  ansible.builtin.command: kubectl apply --server-side -f /etc/kubernetes/calico-installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true
