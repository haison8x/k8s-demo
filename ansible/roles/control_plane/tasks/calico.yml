# Calico through the Tigera operator (Calico 3.33 on Kubernetes >= 1.36:
# CRDs first, then the operator, then the Installation). Runs on every pass
# and only acts while the Installation is missing, so a failed attempt is retried.
- name: Check whether Calico is installed
  ansible.builtin.command: kubectl get installation default
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico
  changed_when: false
  failed_when: false

- name: Install Calico
  when: control_plane_calico.rc != 0
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  block:
    - name: Install the Calico CRDs
      ansible.builtin.command: >-
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/v3_projectcalico_org.yaml
      changed_when: true

    - name: Install the Calico operator
      ansible.builtin.command: >-
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
      changed_when: true

    - name: Wait for the Calico operator CRDs
      ansible.builtin.command: >-
        kubectl wait --for condition=established --timeout=180s
        crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io
      changed_when: false

    - name: Write the Calico installation
      ansible.builtin.template:
        src: calico-installation.yaml.j2
        dest: /etc/kubernetes/calico-installation.yaml
        mode: "0644"

    - name: Install Calico
      ansible.builtin.command: kubectl apply --server-side -f /etc/kubernetes/calico-installation.yaml
      changed_when: true
