- name: Create kubeconfig directories
  ansible.builtin.file:
    path: "{{ item.home }}/.kube"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0700"
  loop:
    - {home: /root, owner: root}
    - {home: "/home/{{ ansible_user }}", owner: "{{ ansible_user }}"}

- name: Install the admin kubeconfig for root and the admin user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ item.home }}/.kube/config"
    remote_src: true
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0600"
  loop:
    - {home: /root, owner: root}
    - {home: "/home/{{ ansible_user }}", owner: "{{ ansible_user }}"}
