# kube-vip runs as a static pod on every control plane and holds the API VIP.
# On Kubernetes >= 1.29, admin.conf has no rights until the cluster exists, so
# the first control plane uses super-admin.conf during `kubeadm init`.
- name: Check whether this control plane is already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kube_vip_admin_conf
  tags: [drift]

- name: Choose the kubeconfig kube-vip uses
  ansible.builtin.set_fact:
    kube_vip_kubeconfig: >-
      {{ '/etc/kubernetes/super-admin.conf'
         if (inventory_hostname == groups['control_plane'][0] and not kube_vip_admin_conf.stat.exists)
         else '/etc/kubernetes/admin.conf' }}
  tags: [drift]

- name: Create the static pod manifest directory
  ansible.builtin.file:
    path: /etc/kubernetes/manifests
    state: directory
    mode: "0755"
  tags: [drift]

- name: Write the kube-vip static pod manifest
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: "0600"
  tags: [drift]
