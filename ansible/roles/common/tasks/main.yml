- name: Configure the proxy
  ansible.builtin.import_tasks: proxy.yml

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [drift]

- name: Add cluster nodes to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} k8s-demo nodes"
    block: |
      {% for host in groups['k8s_cluster'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
  tags: [drift]

- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Keep swap disabled after reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]\S*\s+\S+\s+swap\s.*)$'
    replace: '# \1'
  tags: [drift]

- name: Load kernel modules needed by containerd and Kubernetes networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]
  tags: [drift]

- name: Configure kernel parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward
  tags: [drift]

- name: Install containerd and helper packages
  ansible.builtin.apt:
    name: [containerd, apt-transport-https, ca-certificates, curl, gpg, iputils-arping]
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [drift]

- name: Create the containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"
  tags: [drift]

- name: Generate the default containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: Restart containerd

- name: Configure containerd SystemdCgroup
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd
  tags: [drift]

- name: Create the containerd service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    mode: "0755"
  tags: [drift]

- name: Configure the containerd proxy
  ansible.builtin.template:
    src: containerd-proxy.conf.j2
    dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
    mode: "0644"
  notify: Restart containerd
  tags: [drift]

- name: Enable containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
  tags: [drift]

- name: Add the Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor }}/deb/"
    suites: ["/"]
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor }}/deb/Release.key"
    state: present
  tags: [drift]

- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ kube_minor }}.*"
      - "kubeadm={{ kube_minor }}.*"
      - "kubectl={{ kube_minor }}.*"
    state: present
    update_cache: true
  tags: [drift]

- name: Hold kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]
  tags: [drift]

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
  tags: [drift]
