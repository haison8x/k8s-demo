# Proxy settings for the operating system. Also used on the ops runner.
- name: Configure the apt proxy
  ansible.builtin.template:
    src: apt-proxy.conf.j2
    dest: /etc/apt/apt.conf.d/95proxy
    mode: "0644"
  tags: [proxy, drift]

- name: Configure proxy variables in /etc/environment
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} k8s-demo proxy"
    block: "{{ lookup('ansible.builtin.template', 'environment.j2') }}"
    create: true
    mode: "0644"
  tags: [proxy, drift]
