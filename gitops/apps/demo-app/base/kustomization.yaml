apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  # The generated name carries a content hash, so editing the page template rolls the pods.
  - name: demo-page-template
    files:
      - default.conf.template
