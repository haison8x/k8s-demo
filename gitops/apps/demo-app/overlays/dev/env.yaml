# Environment-specific settings for dev. Never copied by the Promote workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: nginx
          env:
            - name: ENV_NAME
              value: DEV
            - name: ENV_COLOR
              value: "#2e7d32"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
spec:
  rules:
    - host: dev.k8sdemo.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  number: 80
