# Environment-specific settings for staging. Never copied by the Promote workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: nginx
          env:
            - name: ENV_NAME
              value: STAGING
            - name: ENV_COLOR
              value: "#f9a825"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
spec:
  rules:
    - host: staging.k8sdemo.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  number: 80
