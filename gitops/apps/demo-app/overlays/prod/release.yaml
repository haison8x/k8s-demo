# Release settings. The Promote workflow copies this file unchanged to the next
# environment, so keep everything environment-specific in env.yaml.
# APP_MESSAGE must not contain quotes, $, ;, braces or backslashes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.8-alpine
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_MESSAGE
              value: Hello from GitOps
