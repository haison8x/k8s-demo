apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      k8sdemo.vn/env: prod
    includeSelectors: false
    includeTemplates: true
patches:
  # Environment-specific settings: never promoted.
  - path: env.yaml
  # Release settings: promoted unchanged by the Promote workflow.
  - path: release.yaml
