apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-prod
  namespace: demo
  labels:
    k8sdemo.vn/env: prod
spec:
  selector:
    matchLabels:
      app: good-prod
  template:
    metadata:
      labels:
        app: good-prod
    spec:
      containers:
        - name: web
          image: nginx:1.31.8-alpine
