# Test harness: render role templates with one environment's variables into
# tests/out/<env>/ so tests can assert on the generated files.
# Run with: -i ansible/inventories/<env>/hosts.yml -e ansible_connection=local -e ansible_become=false
- name: Render role templates
  hosts: control_plane[0]
  gather_facts: false
  vars_files:
    - ../../ansible/group_vars/all/common.yml
    - ../../ansible/group_vars/all/versions.yml
  vars:
    render_out: "{{ playbook_dir }}/../out/{{ env }}"
    render_templates:
      - ansible/roles/common/templates/apt-proxy.conf.j2
      - ansible/roles/common/templates/environment.j2
      - ansible/roles/common/templates/containerd-proxy.conf.j2
      - ansible/roles/kube_vip/templates/kube-vip.yaml.j2
      - ansible/roles/control_plane/templates/kubeadm-init.yaml.j2
      - ansible/roles/control_plane/templates/calico-installation.yaml.j2
      - tests/ansible/templates/reserved-ips.j2
  tasks:
    - name: Create the output directory
      ansible.builtin.file:
        path: "{{ render_out }}"
        state: directory
        mode: "0755"

    - name: Render each template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "{{ render_out }}/{{ item | basename | splitext | first }}"
        mode: "0644"
      loop: "{{ render_templates }}"
      loop_control:
        label: "{{ item | basename }}"
