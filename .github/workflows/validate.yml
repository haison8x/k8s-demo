# Runs on GitHub-hosted runners only: no access to the LAN, safe for pull requests from forks.
# Every workflow stays off until the repository variable AUTOMATION_ENABLED is 'true'.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the validation toolchain
        run: bash scripts/install-tools.sh

      - name: Validate the repository
        run: bash scripts/validate.sh

      - name: One environment per pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/env-guard.py check-diff "origin/$BASE_REF"
